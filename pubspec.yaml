name: plainjoy
description: "清欢（Plainjoy）— 慢慢吃，吃到刚好。个性化营养记录与下一餐规划。"
publish_to: "none"
version: 0.2.0+2

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State / routing
  flutter_riverpod: ^3.4.3

  # Local-first storage (pure Dart, works on Android/Windows/Linux/Web)
  sembast: ^3.9.0
  sembast_web: ^2.4.6+1
  path_provider: ^2.1.6
  path: ^1.9.1

  # UI / charts / animation
  fl_chart: ^1.3.0
  intl: ^0.20.2

  # Media
  image_picker: ^1.2.4
  file_picker: ^13.3.0

  # AI / data
  http: ^1.6.0
  uuid: ^4.6.0
  collection: ^1.19.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/seed/
    - assets/brand/
    - assets/private/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#FFF6E8"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon/app_icon_monochrome.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#FFF9F2"
    theme_color: "#6E56CF"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256
